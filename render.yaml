services:
  - type: web
    name: n8n
    env: docker
    plan: starter
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      # Configuração básica
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        value: n8n-latest-ffmpeg.onrender.com
      - key: WEBHOOK_URL
        fromService:
          type: web
          name: n8n
          property: url
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n-latest-ffmpeg.onrender.com

      # Autenticação
      - key: N8N_BASIC_AUTH_ACTIVE
        value: 'true'
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: admin123

      # Timezone
      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: TZ
        value: America/Sao_Paulo

      # Segurança
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Configurações de execução
      - key: EXECUTIONS_MODE
        value: regular
      - key: N8N_DIAGNOSTICS_ENABLED
        value: 'false'
      
      # Recomendado para novas versões do n8n
      - key: DB_SQLITE_POOL_SIZE
        value: '5'
      - key: N8N_RUNNERS_ENABLED
        value: 'true'
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: 'false'
      - key: N8N_GIT_NODE_DISABLE_BARE_REPOS
        value: 'true'


      # Banco de dados PostgreSQL persistente
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password

    ports:
      - port: 5678

  # Banco de dados PostgreSQL persistente
  - type: pgsql
    name: n8n-db
    plan: starter
    disk:
      name: n8n-db-data
      sizeGB: 1
