services:
  - type: web
    name: n8n
    env: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: N8N_PORT
        value: 5678
      - key: N8N_BASIC_AUTH_ACTIVE
        value: 'true'
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: admin123
      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: TZ
        value: America/Sao_Paulo
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        fromService:
          type: web
          name: n8n
          property: url
      - key: N8N_HOST
        value: n8n-latest-ffmpeg.onrender.com
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n-latest-ffmpeg.onrender.com
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: EXECUTIONS_MODE
        value: queue
      - key: N8N_DIAGNOSTICS_ENABLED
        value: 'false'
      # Configurações do PostgreSQL
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
    ports:
      - port: 5678

  - type: pgsql
    name: n8n-db
    plan: starter
    ipAllowList: []
    disk:
      name: n8n-db-data
      sizeGB: 1
